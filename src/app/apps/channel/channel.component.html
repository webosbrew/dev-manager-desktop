<div class="p-3">
  @let repoPage = repoPage$ | async;
  @if (repoPage) {
    @if (page === 1 && repoPage.packages.length > 0) {
      <section class="featured-section mb-4">
        <h6 class="featured-heading text-uppercase text-secondary mb-2">Featured</h6>
        <div class="featured-grid">
          @for (item of repoPage.packages.slice(0, 4); track item.id) {
            <button type="button" class="featured-card" (click)="openDetails(item)">
              <img class="featured-icon" [ngSrc]="item.iconUri" [alt]="item.title" width="80" height="80">
              <div class="featured-text">
                <div class="featured-title text-truncate">{{ item.title }}</div>
                <div class="featured-desc text-secondary text-truncate">{{ item.manifest?.appDescription || item.shortDescription }}</div>
                <div class="featured-meta small mt-1">
                  <span class="text-secondary">v{{ item.manifest?.version }}</span>
                  @switch (cardState(item)) {
                    @case ('installed') { <span class="badge text-bg-secondary ms-2">Installed</span> }
                    @case ('update') { <span class="badge text-bg-warning ms-2">Update</span> }
                  }
                </div>
              </div>
            </button>
          }
        </div>
      </section>
    }
    <section>
      <h6 class="text-uppercase text-secondary mb-2">All apps</h6>
      <div class="app-grid">
        @for (item of repoPage.packages; track item.id) {
          @if (item.manifest) {
            <button type="button" class="app-card" (click)="openDetails(item)">
              <img class="app-card-icon" [ngSrc]="item.iconUri" [alt]="item.title" width="96" height="96">
              <div class="app-card-title text-truncate">{{ item.title }}</div>
              <div class="app-card-version text-secondary small">v{{ item.manifest.version }}</div>
              @switch (cardState(item)) {
                @case ('install') { <span class="app-card-pill badge text-bg-primary">Install</span> }
                @case ('installed') { <span class="app-card-pill badge text-bg-secondary">Installed</span> }
                @case ('update') { <span class="app-card-pill badge text-bg-warning">Update</span> }
              }
            </button>
          }
        }
      </div>
    </section>
    <div class="mt-3">
      <ngb-pagination class="d-flex justify-content-center" [collectionSize]="repoPage.paging.maxPage" [(page)]="page"
                      [pageSize]="1" aria-label="App pages" (pageChange)="loadPage($event)">
      </ngb-pagination>
    </div>
  } @else {
    <app-loading-card/>
  }
</div>
