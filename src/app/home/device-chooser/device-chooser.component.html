<div class="modal-header">
  <h5 class="modal-title">Choose Device</h5>
</div>
<ul class="list-group list-group-flush">
  @for (device of (deviceManager.devices$ | async); track device) {
    <li class="list-group-item list-group-item-action"
      (click)="modal.close(device)">
      {{ device.name }}
    </li>
  }
</ul>
