name: 'Build Flatpak'

on:
  release:
    types: [ published ]
  pull_request:
    branches:
      - main
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: Build Flatpak (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate AppStream metainfo
        run: |
          if command -v appstreamcli >/dev/null; then
            appstreamcli validate --no-net flatpak/org.webosbrew.devman.metainfo.xml
          else
            appstream-util validate-relax flatpak/org.webosbrew.devman.metainfo.xml
          fi

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: org.webosbrew.devman.flatpak
          artifact-name: flatpak-x86_64
          manifest-path: flatpak/org.webosbrew.devman.yml
          cache-key: flatpak-gnome50-${{ hashFiles('flatpak/*.yml', 'flatpak/*-sources.json') }}

  attach-release:
    if: github.event_name == 'release'
    needs: build-flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-x86_64
      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" org.webosbrew.devman.flatpak --clobber
