name: 'Build Test'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      runner-type:
        type: choice
        description: 'The type of runner to use'
        required: true
        default: 'ubuntu-24.04'
        options:
          - 'ubuntu-24.04'
          - 'ubuntu-24.04-arm'
          - 'macos-latest'
      build-for:
        type: choice
        description: 'The target to build for'
        required: true
        default: 'desktop'
        options:
          - 'desktop'
          - 'android'
env:
  ANDROID_NDK_VERSION: '28.2.13676358'
  NODE_VERSION: '24.x'

jobs:
  build-desktop:
    if: ${{ !github.event.inputs.build-for || github.event.inputs.build-for == 'desktop' }}
    runs-on: ${{ github.event.inputs.runner-type || 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Required Packages
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file zsync libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev jq openssh-client
          # Match the minimum WebKitGTK used by release AppImages.
          webkit_version="$(pkg-config --modversion webkit2gtk-4.1)"
          echo "Building with WebKitGTK $webkit_version"
          dpkg --compare-versions "$webkit_version" ge 2.52.6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Project
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ runner.os }}-${{ github.event.inputs.runner-type }}-rust
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Test generated renewal script
        if: runner.os == 'Linux'
        run: npm run test:renew-script

      - name: Test frontend
        if: runner.os == 'Linux'
        run: npm test

      - name: Setup JDK
        uses: actions/setup-java@v5
        if: github.event.inputs.build-for == 'android'
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: github.event.inputs.build-for == 'android'
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "build-tools;34.0.0 ndk;${{ env.ANDROID_NDK_VERSION }} platforms;android-34"

      - name: Add NDK to PATH
        if: github.event.inputs.build-for == 'android'
        shell: bash
        run: |
          echo ${NDK_HOME}/toolchains/llvm/prebuilt/*/bin >> $GITHUB_PATH
        env:
          NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"

      - name: Configure AppImage updates
        if: runner.os == 'Linux'
        run: |
          python3 scripts/appimage-update.test.py
          update_info=$(sh scripts/appimage-update-info.sh)
          echo "LDAI_UPDATE_INFORMATION=$update_info" >> "$GITHUB_ENV"

      - name: Build for Desktop
        run: npm run build -- --features=vendored-openssl

      - name: Verify AppImage updates
        if: runner.os == 'Linux'
        run: |
          sh scripts/appimage-zsync.sh target/*/bundle/appimage/*.AppImage
          python3 scripts/verify-appimage-update.py target/*/bundle/appimage/*.AppImage

  build-android:
    if: ${{ !github.event.inputs.build-for || github.event.inputs.build-for == 'android' }}
    runs-on: ${{ github.event.inputs.runner-type || 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Project
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ runner.os }}-${{ github.event.inputs.runner-type }}-rust
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "build-tools;34.0.0 ndk;${{ env.ANDROID_NDK_VERSION }} platforms;android-33"

      - name: Add NDK to PATH
        shell: bash
        run: |
          echo ${NDK_HOME}/toolchains/llvm/prebuilt/*/bin >> $GITHUB_PATH
        env:
          NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"

      - name: Tauri init
        run: npm run tauri android init
        env:
          NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.2
          bundler-cache: 'true'

      - name: Build for Android
        uses: maierj/fastlane-action@v3.2.0
        with:
          lane: build
        env:
          NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
