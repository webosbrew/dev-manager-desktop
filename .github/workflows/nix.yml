name: Nix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Nix package (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check --no-build --no-update-lock-file

      # Building, rather than only evaluating, fetches and verifies the Cargo Git
      # sources, builds the frontend and Rust binary, and runs the flake's tests.
      - name: Build and test package
        run: nix build --print-build-logs --no-link --no-update-lock-file .#packages.x86_64-linux.default
