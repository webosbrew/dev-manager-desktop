# Flatpak manifest for webOS Dev Manager — built from source.
#
# The Angular frontend (npm) and the Tauri/Rust backend (cargo) are compiled
# inside the sandbox with no network access, using the vendored dependency
# sources in node-sources.json and cargo-sources.json. Regenerate those with
# scripts/flatpak-gen-sources.sh whenever package-lock.json or Cargo.lock change.
#
# webkit2gtk-4.1 (what Tauri/wry links against) is provided by the GNOME 46
# runtime, so no extra libraries are built.
#
# See ./README.md for local build and Flathub submission instructions.
id: org.webosbrew.devman
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable
command: webos-dev-manager

finish-args:
  - --socket=wayland # Show the window under Wayland
  - --socket=fallback-x11 # Show the window under X11
  - --device=dri # OpenGL acceleration for the webview
  - --share=ipc # Required together with X11
  - --share=network # Connect to webOS TVs over the network (SSH)
  - --filesystem=home # Read ares-cli/SSH keys and transfer files to/from the TV

modules:
  - name: webos-dev-manager
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
      env:
        # Offline npm cache populated by node-sources.json
        XDG_CACHE_HOME: /run/build/webos-dev-manager/flatpak-node/cache
        npm_config_cache: /run/build/webos-dev-manager/flatpak-node/npm-cache
        npm_config_offline: 'true'
        npm_config_nodedir: /usr/lib/sdk/node20
        # Offline cargo registry populated by cargo-sources.json
        CARGO_HOME: /run/build/webos-dev-manager/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      # The application source. For a Flathub submission, replace this with a
      # pinned release, e.g.:
      #
      #   - type: archive
      #     url: https://github.com/webosbrew/dev-manager-desktop/archive/refs/tags/v1.99.16.tar.gz
      #     sha256: <sha256-of-the-tarball>
      #
      # and regenerate the vendored sources from that revision's lockfiles.
      - type: dir
        path: ..

      # Vendored dependencies (generated by scripts/flatpak-gen-sources.sh).
      - node-sources.json
      - cargo-sources.json

    build-commands:
      # Restore node_modules from the offline cache.
      - npm ci --offline

      # Build the Angular frontend into ../dist (embedded by tauri-build).
      - npm run ng build

      # Build the Tauri backend. Matches the flags used for the .deb/AppImage
      # release builds (vendored OpenSSL + libssh).
      - cargo build --offline --release --features vendored-openssl --manifest-path src-tauri/Cargo.toml

      # Install the executable.
      - install -Dm755 target/release/webos-dev-manager ${FLATPAK_DEST}/bin/webos-dev-manager

      # Desktop entry, icons (renamed to the Flatpak app id) and AppStream data.
      - install -Dm644 flatpak/org.webosbrew.devman.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 src-tauri/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 flatpak/org.webosbrew.devman.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
