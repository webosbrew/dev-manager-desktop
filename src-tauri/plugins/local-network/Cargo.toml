[package]
name = "tauri-plugin-local-network"
version = "0.1.0"
description = "Open sockets to LAN devices on the Android network that reaches them"
license = "Apache-2.0"
edition = "2021"
publish = false
# tauri-build finds the Android library of a plugin through this name.
links = "tauri-plugin-local-network"

[dependencies]
tauri = { version = "2.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.29"

[target.'cfg(target_os = "android")'.dependencies]
socket2 = "0.6"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }
